# ============================================
#  nginx config for the FoundersDock SPA
# ============================================

server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Don't advertise the nginx version.
    server_tokens off;

    # --- Compression -------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain
                      text/css
                      text/javascript
                      application/javascript
                      application/json
                      application/xml
                      image/svg+xml;

    # --- Security headers --------------------------------
    # `connect-src` must include the production API origin,
    # otherwise the browser blocks every fetch.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN"  always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy     "camera=(), microphone=(), geolocation=()" always;

    # --- SPA history-API fallback ------------------------
    # THIS IS THE LINE MOST SPA DEPLOYMENTS FORGET.
    # React Router owns /login, /explore, /dashboard/... .
    # Without this, refreshing or sharing any of those URLs
    # returns 404 because nginx looks for a real file.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Hashed build assets: cache forever ---------------
    # Vite emits filenames like app-B7xK2pQ9.js, so a new
    # deploy always produces new URLs. Safe to cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Fonts, images, and anything else at the root.
    location ~* \.(?:ico|css|js|jpg|jpeg|png|gif|svg|webp|avif|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # --- index.html: NEVER cache -------------------------
    # This file references the hashed assets. If a CDN or
    # browser holds a stale copy, users get a 404 on the
    # new asset filenames after every deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # --- Health check (used by ECS + ALB) ----------------
    location = /health {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"status":"ok"}';
    }

    # Block access to dotfiles (.env, .git, etc.)
    location ~ /\. {
        deny all;
        return 404;
    }

    error_page 404 /index.html;
}
